name: Unzip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip archive
        run: |
          unzip -o agentallowance-testnet.zip
          rm agentallowance-testnet.zip
      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Unzip agentallowance testnet preview" || echo "nothing to commit"
          git push
